name: Render HyperFrames video

on:
  workflow_dispatch:
    inputs:
      spec_path:
        description: "Repository-relative deck JSON path"
        required: true
        default: "examples/modular-showcase.json"
        type: string
      output_name:
        description: "Artifact base name (letters, numbers, _ and - only)"
        required: true
        default: "html-slide-video"
        type: string
      concurrency:
        description: "Compatibility render concurrency (for example 50% or 2; mapped to HyperFrames workers)"
        required: true
        default: "50%"
        type: string
  push:
    branches:
      - "render/**"

permissions:
  contents: read

concurrency:
  group: hyperframes-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout trusted renderer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 1

      - name: Extract transient render job
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          JOB_ROOT="$RUNNER_TEMP/html-slide-render-job"
          mkdir -p "$JOB_ROOT"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git archive "$GITHUB_SHA" .render | tar -x -C "$JOB_ROOT" --strip-components=1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve render request
        id: request
        shell: bash
        env:
          MANUAL_SPEC_PATH: ${{ inputs.spec_path }}
          MANUAL_OUTPUT_NAME: ${{ inputs.output_name }}
          MANUAL_CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            python tools/render_request.py push \
              --root "$RUNNER_TEMP/html-slide-render-job" \
              --ref-name "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            python tools/render_request.py manual \
              --root "$GITHUB_WORKSPACE" \
              --spec-path "$MANUAL_SPEC_PATH" \
              --output-name "$MANUAL_OUTPUT_NAME" \
              --concurrency "$MANUAL_CONCURRENCY" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python contracts
        run: python -m pip install -r requirements-modular.txt

      - name: Install video runtime
        run: npm install --prefix video --no-audit --no-fund

      - name: Run HyperFrames video contract tests
        run: python -m unittest tests.test_hyperframes_pipeline

      - name: Render and verify MP4
        env:
          OUTPUT_NAME: ${{ steps.request.outputs.output_name }}
          RENDER_CONCURRENCY: ${{ steps.request.outputs.render_concurrency }}
        run: |
          python tools/render_video.py "${{ steps.request.outputs.spec_real }}" \
            --asset-root "${{ steps.request.outputs.asset_root }}" \
            --out "$GITHUB_WORKSPACE/dist/render/$OUTPUT_NAME.mp4" \
            --work-dir "$GITHUB_WORKSPACE/dist/render/work" \
            --concurrency "$RENDER_CONCURRENCY" \
            --keep-work

      - name: Upload rendered video and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.request.outputs.output_name }}-${{ github.run_id }}
          path: |
            dist/render/*.mp4
            dist/render/*.qa.json
            dist/render/work/index.html
            dist/render/work/video.manifest.json
            dist/render/work/hyperframes-check.json
            dist/render/work/frames/*.png
          if-no-files-found: warn
          retention-days: 7

  cleanup-render-branch:
    needs: render
    if: ${{ needs.render.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/render/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete successful transient render branch
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.ref.replace('refs/heads/', '');
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${ref}`,
            });
