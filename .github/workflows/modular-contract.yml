name: Modular contract

on:
  pull_request:
    paths:
      - "core/**"
      - "modules/**"
      - "presets/**"
      - "styles/**"
      - "themes/**"
      - "tests/test_modular.py"
      - "tests/modular_runtime_check.py"
      - "tools/verify_modular.py"
      - "requirements-modular.txt"
      - "SKILL.md"
      - "references/**"
  push:
    branches: [main]
    paths:
      - "core/**"
      - "modules/**"
      - "presets/**"
      - "styles/**"
      - "themes/**"
      - "tests/test_modular.py"
      - "tests/modular_runtime_check.py"
      - "tools/verify_modular.py"
      - "requirements-modular.txt"
      - "SKILL.md"
      - "references/**"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-modular.txt
      - name: Install contract dependencies
        run: python -m pip install "jsonschema>=4.22,<5" "playwright>=1.48,<2"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run modular compiler tests
        run: python -m unittest discover -s tests -p "test_modular.py"
      - name: Run modular browser regressions
        run: python tests/modular_runtime_check.py
