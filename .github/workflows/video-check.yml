name: Video pipeline checks

on:
  pull_request:
    paths:
      - "core/**"
      - "modules/**"
      - "styles/**"
      - "tools/compose_hyperframes.py"
      - "tools/hyperframes_pipeline.py"
      - "tools/hyperframes_project.py"
      - "tools/motion_patterns.py"
      - "tools/render_video.py"
      - "tools/render_request.py"
      - "tools/verify_hyperframes.py"
      - "tools/compose_video.py"
      - "tools/verify_video.py"
      - "tools/video_pipeline.py"
      - "video/**"
      - "tests/test_hyperframes_pipeline.py"
      - "tests/test_motion_patterns.py"
      - "tests/test_render_request.py"
      - "tests/test_video_pipeline.py"
      - ".github/workflows/video-check.yml"
      - ".github/workflows/render-video.yml"
  push:
    branches: ["main"]
    paths:
      - "core/**"
      - "modules/**"
      - "styles/**"
      - "tools/compose_hyperframes.py"
      - "tools/hyperframes_pipeline.py"
      - "tools/motion_patterns.py"
      - "tools/render_video.py"
      - "tools/render_request.py"
      - "tools/verify_hyperframes.py"
      - "tools/compose_video.py"
      - "tools/verify_video.py"
      - "tools/video_pipeline.py"
      - "video/**"
      - "tests/test_hyperframes_pipeline.py"
      - "tests/test_video_pipeline.py"
      - ".github/workflows/video-check.yml"
      - ".github/workflows/render-video.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python contracts
        run: python -m pip install -r requirements-modular.txt

      - name: Install video runtime
        run: npm install --prefix video --no-audit --no-fund

      - name: Run modular compiler tests
        run: python -m unittest discover -s tests -p 'test_modular.py'

      - name: Run HyperFrames pipeline tests
        run: python -m unittest tests.test_hyperframes_pipeline tests.test_motion_patterns tests.test_render_request

      - name: Run legacy Remotion pipeline tests during migration
        run: python -m unittest tests.test_video_pipeline

      - name: Typecheck legacy Remotion runtime during migration
        run: npm --prefix video run typecheck

      - name: Compile showcase HyperFrames composition
        run: |
          python tools/hyperframes_project.py examples/modular-showcase.json \
            --out-dir dist/video-ci \
            --font assets/fonts/PretendardVariable.woff2
          cp video/node_modules/gsap/dist/gsap.min.js dist/video-ci/gsap.min.js

      - name: Check showcase HyperFrames composition
        run: video/node_modules/.bin/hyperframes check dist/video-ci --json --samples 3 --timeout 3000
