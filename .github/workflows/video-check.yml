name: Video pipeline checks

on:
  pull_request:
    paths:
      - "core/**"
      - "modules/**"
      - "styles/**"
      - "tools/compose_video.py"
      - "tools/motion_patterns.py"
      - "tools/render_video.py"
      - "tools/render_request.py"
      - "tools/verify_video.py"
      - "tools/video_pipeline.py"
      - "tests/test_video_pipeline.py"
      - "package.json"
      - ".github/workflows/video-check.yml"
      - ".github/workflows/render-video.yml"
  push:
    branches: ["main"]
    paths:
      - "core/**"
      - "modules/**"
      - "styles/**"
      - "tools/compose_video.py"
      - "tools/motion_patterns.py"
      - "tools/render_video.py"
      - "tools/render_request.py"
      - "tools/verify_video.py"
      - "tools/video_pipeline.py"
      - "tests/test_video_pipeline.py"
      - "package.json"
      - ".github/workflows/video-check.yml"
      - ".github/workflows/render-video.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python contracts
        run: python -m pip install -r requirements-modular.txt

      - name: Install HyperFrames
        run: npm install --no-audit --no-fund

      - name: Run modular compiler tests
        run: python -m unittest discover -s tests -p 'test_modular.py'

      - name: Run video pipeline tests
        run: python -m unittest tests.test_video_pipeline

      - name: Build showcase HyperFrames composition
        run: |
          python tools/compose_video.py examples/modular-showcase.json \
            --out dist/video-ci/index.html \
            --timing-out dist/video-ci/timing.json

      - name: Verify showcase timing
        run: python tools/verify_video.py dist/video-ci/timing.json

      - name: Lint HyperFrames composition
        run: ./node_modules/.bin/hyperframes lint dist/video-ci

      - name: Check HyperFrames runtime
        run: ./node_modules/.bin/hyperframes check dist/video-ci --samples 7 --no-contrast --frame-check --snapshots

      - name: Upload HyperFrames QA snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-video-check-${{ github.run_id }}
          path: |
            dist/video-ci/index.html
            dist/video-ci/timing.json
            dist/video-ci/snapshots/*.png
          if-no-files-found: warn
          retention-days: 7
